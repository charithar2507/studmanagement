<!DOCTYPE html>
<html>
    <head>
        <title>Student Management System</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form id="sms">
            <p >Student Name :</p>
            <input type="text" name="name" id="name" placeholder="Enter Student Name" required>
            <p>Student ID :</p>
            <input type="text" name="id" id="id" placeholder="Enter Student ID" required>
            <button type="submit" id="submit" onclick="display()">Submit</button>
            <p id="result"></p>
            <p id="error"></p>
        </form>
        <script src="script.js"></script>
    </body>
</html>
